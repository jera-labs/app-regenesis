# ============================================================================
# nginx.conf - Neurohackers VPS
# 3 server blocks tras el cutover unificado (2026-06-03):
#   1. default_server + EasyPanel healthcheck: sigue sirviendo viejo HTML
#      como fallback (NUNCA accesible públicamente porque neurohackers.cloud
#      lo captura el server 2 abajo).
#   2. neurohackers.cloud + www: 301 a plataforma.neurohackers.cloud/regenesis/
#   3. plataforma.neurohackers.cloud: sirve la plataforma nueva desde /app/
# ============================================================================

# --- SERVER 1: default catchall + EasyPanel healthcheck ---
# Sirve HTML viejo como red de seguridad. Solo activo cuando nadie matchea por hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name website-regenesis.m7zv0q.easypanel.host _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript text/html application/javascript application/json application/xml image/svg+xml font/woff font/woff2;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://link.msgsndr.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.supabase.io wss://*.supabase.co https://api.leadconnectorhq.com https://*.leadconnectorhq.com; media-src 'self' https://assets.cdn.filesafe.space https://*.filesafe.space; frame-src 'self' https://www.loom.com https://*.loom.com https://api.leadconnectorhq.com https://*.leadconnectorhq.com https://link.msgsndr.com https://*.msgsndr.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\.(env|git|ht|md|sql|bak|swp|DS_Store) { deny all; return 404; }
    location ~* \.(env|md|sql|bak|swp|log|conf|ini)$ { deny all; return 404; }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|otf|eot|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /app/ { return 404; }
    location = /app   { return 404; }
    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /index.html;
}

# --- SERVER 2: neurohackers.cloud (apex + www) → 301 a plataforma/regenesis/ ---
# Preserva path completo + query string. SEO: 301 = permanent.
# Ejemplos:
#   https://neurohackers.cloud/                          → https://plataforma.neurohackers.cloud/regenesis/
#   https://neurohackers.cloud/bienvenida.html?gid=ABC   → https://plataforma.neurohackers.cloud/regenesis/bienvenida.html?gid=ABC
#   https://neurohackers.cloud/admin.html                → https://plataforma.neurohackers.cloud/regenesis/admin.html
#   https://neurohackers.cloud/assets/styles/tokens.css  → https://plataforma.neurohackers.cloud/regenesis/assets/styles/tokens.css
server {
    listen 80;
    listen [::]:80;
    server_name neurohackers.cloud www.neurohackers.cloud;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://plataforma.neurohackers.cloud/regenesis$request_uri;
}

# --- SERVER 3: Plataforma nueva (sin cambios) ---
server {
    listen 80;
    listen [::]:80;
    server_name plataforma.neurohackers.cloud;

    root /usr/share/nginx/html/app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript text/html application/javascript application/json application/xml image/svg+xml font/woff font/woff2;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://link.msgsndr.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.supabase.io wss://*.supabase.co https://api.leadconnectorhq.com https://*.leadconnectorhq.com; media-src 'self' https://assets.cdn.filesafe.space https://*.filesafe.space; frame-src 'self' https://www.loom.com https://*.loom.com https://api.leadconnectorhq.com https://*.leadconnectorhq.com https://link.msgsndr.com https://*.msgsndr.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\.(env|git|ht|md|sql|bak|swp|DS_Store) { deny all; return 404; }
    location ~* \.(env|md|sql|bak|swp|log|conf|ini)$ { deny all; return 404; }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|otf|eot|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /index.html;
}
