<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re-Génesis · Panel admin</title>
  <link rel="icon" type="image/svg+xml" href="/regenesis/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="/shared/turbo.min.js?v=20260797"></script>
  <link rel="stylesheet" href="/regenesis/assets/styles/tokens.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/base.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/components.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/client.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/admin.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/platform-sidebar.css?v=20260797">
  <style>
    /* Sidebar admin viejo de Re-Génesis oculto (sustituido por el de plataforma) */
    .admin-sidebar { display: none !important; }

    body.with-sidebar .admin-main { padding: var(--space-6); max-width: 1280px; margin: 0 auto; }
    @media (max-width: 920px) {
      body.with-sidebar .admin-main { padding: var(--space-4); }
    }

    #page-dashboard { transition: opacity 0.2s ease; opacity: 0; }
    body.regenesis-ready #page-dashboard { opacity: 1; }

    #regenesis-loader {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: regenesis-spin 0.8s linear infinite;
      z-index: 10;
    }
    @keyframes regenesis-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    body.regenesis-ready #regenesis-loader { display: none; }
  </style>
</head>
<body class="with-sidebar admin-mode">

<div id="regenesis-loader" aria-label="Cargando"></div>

<div id="sidebar-wrapper" data-turbo-permanent></div>
<!-- URL bajo /admin/regenesis/ → detectarContexto detecta admin por URL,
     ya no hace falta data-context="admin". -->
<div data-nav data-active="admin-regenesis-inicio" data-base="../../"></div>

<main class="admin-main">

  <section id="page-dashboard" class="page active">
    <div class="page-header">
      <p class="page-eyebrow">RE-GÉNESIS · INICIO</p>
      <h1 class="page-title">Hola, <span data-admin-name>—</span>.</h1>
      <p class="page-subtitle">Resumen del programa en este momento.</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card dark">
        <span class="kpi-label">CLIENTES ACTIVOS</span>
        <span class="kpi-num" id="kpi-clientes-activos">0</span>
        <span class="kpi-meta" id="kpi-clientes-total">—</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">REFLEXIONES (7d)</span>
        <span class="kpi-num" id="kpi-reflexiones">0</span>
        <span class="kpi-meta">esta semana</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">ADHERENCIA</span>
        <span class="kpi-num" id="kpi-adherencia">0%</span>
        <span class="kpi-meta">promedio del cohorte</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">PRÓXIMA SESIÓN</span>
        <span class="kpi-num" id="kpi-proxima-sesion">—</span>
        <span class="kpi-meta" id="kpi-proxima-meta">—</span>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Actividad reciente</h2>
        <span class="section-meta">ÚLTIMAS 5 REFLEXIONES</span>
      </div>
      <div class="table-wrap">
        <ul id="actividad-reciente" class="activity-list"></ul>
      </div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/scripts/config.js?v=20260797"></script>
<script src="/shared/scripts/supabase-client.js?v=20260797"></script>
  <script src="/shared/scripts/cache.js?v=20260797"></script>
<script src="/shared/scripts/utils.js?v=20260797"></script>
<script src="/shared/scripts/auth.js?v=20260797"></script>
  <script src="/shared/scripts/event-tracker.js?v=20260797"></script>
<script src="/shared/scripts/admin-gate.js?v=20260797"></script>
<script src="/regenesis/assets/scripts/utils.js?v=20260797"></script>
<script src="/admin/regenesis/scripts/inicio.js?v=20260797"></script>
<script src="/shared/nav.js?v=20260797"></script>

<script>
  (async function bootAdminInicio() {
    let tries = 0;
    while (typeof window.regenesisAdminInicioInit !== 'function' && tries < 60) {
      await new Promise(r => setTimeout(r, 50));
      tries++;
    }
    if (typeof window.regenesisAdminInicioInit !== 'function') {
      console.error('[Re-Génesis/Admin] regenesisAdminInicioInit no expuesto.');
      return;
    }
    try { await window.regenesisAdminInicioInit(); }
    catch (e) { console.error('[Re-Génesis/Admin] init error:', e); }
  })();
</script>

</body>
</html>
