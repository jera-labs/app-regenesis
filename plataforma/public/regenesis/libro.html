<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re-Génesis · Mi libro</title>
  <link rel="icon" type="image/svg+xml" href="/regenesis/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="/shared/turbo.min.js?v=20260797"></script>
  <link rel="stylesheet" href="/regenesis/assets/styles/tokens.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/base.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/components.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/client.css?v=20260797">
  <link rel="stylesheet" href="/regenesis/assets/styles/platform-sidebar.css?v=20260797">
  <style>
    .app-header { display: none !important; }
    body.with-sidebar .screen { padding-left: 0; }
    body.with-sidebar .app-container { max-width: 1280px; padding: var(--space-6); margin: 0 auto; }
    @media (max-width: 920px) {
      body.with-sidebar .app-container { padding: var(--space-4); }
    }
    #screen-libro { transition: opacity 0.2s ease; }
    #screen-libro.is-ready { opacity: 1 !important; }
    #regenesis-loader {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: regenesis-spin 0.8s linear infinite;
      z-index: 10;
    }
    @keyframes regenesis-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    body.regenesis-ready #regenesis-loader { display: none; }
  </style>
</head>
<body class="with-sidebar">

<div id="regenesis-loader" aria-label="Cargando"></div>

<div id="sidebar-wrapper" data-turbo-permanent></div>
<div data-nav data-active="rg-libro" data-base="../"></div>

<section id="screen-libro" class="screen active" style="opacity: 0;">
  <div class="app-container">
    <!-- Hero card dinámico según estado -->
    <div id="libro-hero"></div>

    <!-- Galería visual de los 10 capítulos -->
    <div class="libro-capitulos-section">
      <div class="libro-section-eyebrow">LOS 10 CAPÍTULOS</div>
      <h2 class="libro-section-title">Tu mapa de la transformación.</h2>
      <p class="libro-section-sub">
        Cada semana es un capítulo. Cada día, una página. Aquí ves cómo se llenan en tiempo real.
      </p>
      <div class="libro-capitulos-grid" id="libro-capitulos"></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/scripts/config.js?v=20260797"></script>
<script src="/shared/scripts/supabase-client.js?v=20260797"></script>
  <script src="/shared/scripts/cache.js?v=20260797"></script>
<script src="/shared/scripts/utils.js?v=20260797"></script>
<script src="/shared/scripts/auth.js?v=20260797"></script>
  <script src="/shared/scripts/event-tracker.js?v=20260797"></script>
  <script src="/shared/scripts/nps.js?v=20260797"></script>
<script src="/shared/scripts/jobs.js?v=20260797"></script>
<script src="/regenesis/assets/scripts/utils.js?v=20260797"></script>
<script src="/regenesis/assets/scripts/ia-service.js?v=20260797"></script>
<script src="/regenesis/assets/scripts/client-app.js?v=20260800"></script>
<script src="/shared/nav.js?v=20260797"></script>

<script>
  (async function bootLibro() {
    let tries = 0;
    while (typeof window.regenesisLibroInit !== 'function' && tries < 60) {
      await new Promise(r => setTimeout(r, 50));
      tries++;
    }
    if (typeof window.regenesisLibroInit !== 'function') {
      console.error('[Re-Génesis/Libro] regenesisLibroInit no expuesto.');
      return;
    }
    try {
      await window.regenesisLibroInit();
      document.getElementById('screen-libro')?.classList.add('is-ready');
      // Inyectar botón "Descargar PDF" en el hero (la sección post-init que tiene el libro completo)
      inyectarBotonDescargarPDF();
    } catch (e) {
      console.error('[Re-Génesis/Libro] init error:', e);
    }
  })();

  // ============================================================
  // Botón "Descargar PDF" — encola un job pdf_libro y polls hasta listo
  // ============================================================
  async function inyectarBotonDescargarPDF() {
    const hero = document.getElementById('libro-hero');
    if (!hero) return;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin: 16px 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;';
    wrap.innerHTML = `
      <div style="flex: 1; min-width: 200px;">
        <div style="font-weight: 600; font-size: 14px;">Descarga tu libro como PDF</div>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Tus reflexiones, respuestas IA y cierres del día, en un solo archivo descargable.</div>
      </div>
      <button id="btn-pdf-libro" class="btn btn-primary" style="white-space: nowrap;">
        Generar PDF →
      </button>
    `;
    hero.appendChild(wrap);

    const btn = document.getElementById('btn-pdf-libro');
    btn.addEventListener('click', async () => {
      try {
        if (!window.jobsApi) throw new Error('jobsApi no cargó');
        const { data: { session } } = await window.db.auth.getSession();
        if (!session) throw new Error('Sin sesión');
        const { data: lead } = await window.db.from('leads').select('id, nombre').eq('email', session.user.email).maybeSingle();
        if (!lead) throw new Error('No se encontró tu lead');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;"></span> Encolando…';

        const job = await window.jobsApi.encolar('pdf_libro', { dias: 70 }, lead.id);
        btn.innerHTML = '<span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;"></span> Generando PDF…';

        const final = await window.jobsApi.esperar(job.id, (r) => {
          if (r?.estado === 'procesando') btn.innerHTML = '<span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;"></span> Generando PDF…';
        }, { intervalMs: 3000, timeoutMs: 90000 });

        if (final?.estado === 'completado' && final?.resultado?.url) {
          // Abrir el PDF en pestaña nueva (signed URL válida 7 días)
          window.open(final.resultado.url, '_blank', 'noopener,noreferrer');
          btn.innerHTML = '✓ PDF generado · abrir';
          btn.disabled = false;
          btn.onclick = () => window.open(final.resultado.url, '_blank', 'noopener,noreferrer');
        } else {
          btn.innerHTML = 'Reintentar';
          btn.disabled = false;
          window.utils?.toast?.('No se pudo generar el PDF: ' + (final?.ultimo_error || 'desconocido'), 'error', 6000);
        }
      } catch (e) {
        console.error('[Libro PDF]', e);
        btn.disabled = false;
        btn.innerHTML = 'Reintentar';
        window.utils?.toast?.('Error: ' + (e.message || e), 'error', 6000);
      }
    });
  }
</script>

</body>
</html>
